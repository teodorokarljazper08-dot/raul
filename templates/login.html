<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | 𝘾𝙊𝙇𝙎 ✘ Karl Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0a0c12] min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#12141c] rounded-2xl p-8 w-full max-w-md border border-blue-500/30 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-cloud-upload-alt text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">𝘾𝙊𝙇𝙎 ✘ <span class="text-blue-400">Karl</span></h1>
            <p class="text-gray-400 text-sm mt-1">Bot Hosting Platform</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500 rounded-lg p-3 mb-4 text-red-400 text-sm text-center">
            <i class="fas fa-exclamation-triangle mr-2"></i> {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="bg-green-500/20 border border-green-500 rounded-lg p-3 mb-4 text-green-400 text-sm text-center">
            <i class="fas fa-check-circle mr-2"></i> {{ success }}
        </div>
        {% endif %}

        {% if show_otp %}
        <!-- Step 2: OTP -->
        <form method="POST">
            <input type="hidden" name="step" value="otp">
            <div class="mb-6">
                <label class="block text-gray-400 text-sm mb-2">
                    <i class="fab fa-telegram-plane mr-1 text-blue-400"></i> OTP Code (sent via Telegram bot)
                </label>
                <input type="text" name="otp_code" required autofocus maxlength="6"
                    placeholder="000000"
                    class="w-full bg-[#0c0e14] border border-blue-500 rounded-lg px-4 py-3 text-white text-center text-2xl tracking-widest focus:border-blue-400 focus:outline-none transition">
            </div>
            <button type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-600 text-white font-bold py-3 rounded-lg transition transform hover:scale-105">
                <i class="fas fa-key mr-2"></i> Verify OTP
            </button>
        </form>
        {% else %}
        <!-- Step 1: Username + Password -->
        <form method="POST">
            <input type="hidden" name="step" value="login">
            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-2">Username</label>
                <input type="text" name="username" required autofocus
                    class="w-full bg-[#0c0e14] border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none transition">
            </div>
            <div class="mb-6">
                <label class="block text-gray-400 text-sm mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full bg-[#0c0e14] border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none transition">
            </div>
            <button type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-600 text-white font-bold py-3 rounded-lg transition transform hover:scale-105">
                <i class="fas fa-sign-in-alt mr-2"></i> Login
            </button>
        </form>
        {% endif %}

        <div class="text-center mt-6">
            <p class="text-gray-600 text-xs">
                <i class="fas fa-shield-alt"></i> Secure Access &mdash; 𝘾𝙊𝙇𝙎 ✘ Karl Hosting
            </p>
        </div>
    </div>
</body>
</html>
